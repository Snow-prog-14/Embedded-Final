<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Air Quality Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Chart.js for the forecast line graph -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div id="header"></div>

  <main>
    <!-- Snapshot cards -->
<section class="cards cards-row-1">
  <div class="card">
    <span class="label">Status</span>
    <span class="value"><span id="statusText">--</span></span>
  </div>

  <div class="card">
    <span class="label">PM2.5</span>
    <span class="value"><span id="pm25">--</span> <span class="unit">µg/m³</span></span>
  </div>

  <div class="card">
    <span class="label">PM10</span>
    <span class="value"><span id="pm10">--</span> <span class="unit">µg/m³</span></span>
  </div>

  <div class="card">
    <span class="label">Temperature</span>
    <span class="value"><span id="temp">--</span> <span class="unit">°C</span></span>
  </div>

  <div class="card">
    <span class="label">Humidity</span>
    <span class="value"><span id="humidity">--</span> <span class="unit">%</span></span>
  </div>
</section>


<section class="cards cards-row-2">
  <div class="card">
    <span class="label">AQI</span>
    <span class="value"><span id="aqi">--</span></span>
  </div>

  <div class="card">
    <span class="label">Toxic</span>
    <span class="value"><span id="toxic">--</span></span>
  </div>

  <div class="card">
    <span class="label">Flame</span>
    <span class="value"><span id="flame">--</span></span>
  </div>

  <div class="card">
    <span class="label">Smoke</span>
    <span class="value"><span id="smoke">--</span></span>
  </div>

  <div class="card">
    <span class="label">VOC</span>
    <span class="value"><span id="voc">--</span></span>
  </div>
</section>

    <!-- Forecast with user defined duration and line chart -->
    <section class="forecast">
      <header class="forecast-header">
        <div>
          <h2>Air Quality Forecast</h2>
          <p class="forecast-subtitle">
            Forecast based on the duration you choose.
          </p>
        </div>

        <div class="aqi-summary">
          <span class="aqi-summary-label">Air Quality Index over selected period</span>
          <span class="aqi-summary-value" id="aqiSummary">--</span>
        </div>
      </header>
      <!-- Line chart -->
      <div class="aqi-chart-box">
        <div class="forecast-chart-split">
          <div class="chart-panel">
            <span class="chart-title">History</span>
            <canvas id="historyChart"></canvas>
          </div>

          <div class="chart-panel">
            <span class="chart-title">Forecast</span>
            <canvas id="forecastChart"></canvas>
          </div>
        </div>
      </div>
    </section>

    <!-- Links to other pages -->
    <section class="links">
      <a href="history.html">History</a>
      <a href="alerts.html">Alerts</a>
      <a href="settings.html">Settings</a>
    </section>
  </main>

  <div id="footer"></div>
  <script src="js/settings.js"></script>
  <script src="js/forecast.js"></script>
  <script src="js/sensors.js"></script>
  <script src="js/main.js"></script>
<script src="js/history.js"></script>
  <script src="js/alerts.js"></script>
</body>
</html>
