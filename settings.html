<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - Barangay Ugong AQ</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header"></div>

  <main>
    <h2 class="section-title">Settings</h2>
    <p style="font-size: 0.9rem; color: #9ca3af; margin-bottom: 1rem;">
      Configure alert thresholds and basic options. These settings will later connect to the backend and database.
    </p>

    <section class="forecast" style="max-width: 480px; margin-top: 0;">
      <header class="forecast-header">
        <div>
          <h2 style="font-size: 1.05rem;">Alert thresholds</h2>
          <p class="forecast-subtitle">
            When readings go above these values, alerts will be generated.
          </p>
        </div>
      </header>

      <form id="settingsForm">
        <label>
          PM2.5 limit (µg/m³)
          <input type="number" id="pm25Threshold" min="0" value="35">
        </label>

        <label>
          PM10 limit (µg/m³)
          <input type="number" id="pm10Threshold" min="0" value="50">
        </label>

        <label>
          CO₂ limit (ppm)
          <input type="number" id="co2Threshold" min="0" value="1000">
        </label>

        <label>
          AQI limit
          <input type="number" id="aqiThreshold" min="0" max="500" value="100">
        </label>

        <button type="submit">Save settings</button>
      </form>
    </section>
  </main>

  <div id="footer"></div>
  <script src="js/main.js"></script>
</body>
</html>
