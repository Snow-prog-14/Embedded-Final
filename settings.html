<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="header"></div>

<main>
  <h1 class="settings-title">Settings</h1>

  <section class="settings-grid">

    <!-- Notification Settings -->
    <div class="settings-card">
      <h2>Notification Settings</h2>

      <label class="settings-label">
        Email Address (for alerts)
        <input type="email" id="notifEmail" placeholder="example@email.com">
      </label>

      <label class="settings-label">
        Enable Notifications
        <select id="notifToggle">
          <option value="on">On</option>
          <option value="off">Off</option>
        </select>
      </label>
    </div>

    <!-- Forecast Settings -->
    <div class="settings-card">
      <h2>Forecast Settings</h2>

      <label class="settings-label">
        Default Forecast Duration (minutes)
        <input type="number" id="defaultForecast" min="10" max="240" value="60">
      </label>
    </div>

    <!-- Device Settings -->
    <div class="settings-card">
      <h2>Device Settings</h2>

      <label class="settings-label">
        Auto-refresh (seconds)
        <input type="number" id="refresh" min="2" value="5">
      </label>

      <label class="settings-label">
        Theme
        <select id="themeSelect">
          <option value="dark" selected>Dark Mode</option>
          <option value="light">Light Mode</option>
        </select>
      </label>
    </div>

  </section>

  <button class="settings-save-btn">Save Settings</button>
</main>

<div id="footer"></div>

<script src="js/main.js"></script>
</body>
</html>
