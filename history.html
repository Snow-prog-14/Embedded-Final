<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>History AQI</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/history.css">
</head>
<body>
  <div id="header"></div>

  <main>
    <h2 class="section-title">History</h2>
    <p style="font-size: 0.9rem; color: #9ca3af; margin-bottom: 1rem;">
      Browse previous combined dashboard readings by date.
    </p>

    <section class="forecast" style="margin-top: 0;">
      <header class="forecast-header">
        <div>
          <h2 style="font-size: 1.05rem;">Filter readings</h2>
          <p class="forecast-subtitle">
            Select a range to view past dashboard values.
          </p>
        </div>
      </header>

      <form id="historyFilter" class="history-form">
        <label>
          From
          <input type="datetime-local" id="fromDateTime">
        </label>

        <label>
          To
          <input type="datetime-local" id="toDateTime">
        </label>

        <button type="button" id="showHistoryBtn" class="green-btn">
          Show History
        </button>

        <button type="button" id="downloadHistoryBtn" class="blue-btn">
          Download CSV/XLSX
        </button>
      </form>

      <div class="forecast-table-wrapper">
        <table id="historyTable">
          <thead>
            <tr>
              <th>Time</th>
              <th>AQI</th>
              <th>PM2.5 (µg/m³)</th>
              <th>PM10 (µg/m³)</th>
              <th>Temperature (°C)</th>
              <th>Humidity (%)</th>
              <th>Toxic index</th>
              <th>Flammable index</th>
              <th>Smoke index</th>
              <th>VOC index</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td colspan="10" style="text-align: center; font-size: 0.9rem; color: #9ca3af;">
                History will appear here once the backend is connected.
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="footer"></div>
  <script src="js/settings.js"></script>
  <script src="js/forecast.js"></script>
  <script src="js/sensors.js"></script>
  <script src="js/main.js"></script>
  <script src="js/history.js"></script>
</body>
</html>
