<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Monitoring - Barangay Ugong AQ</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header"></div>

  <main>
    <h2 class="section-title">Live monitoring</h2>
    <p id="connectionStatus">Status: connecting to sensor API...</p>

    <section class="live-cards">
      <div class="live-card">
        <p>PM2.5</p>
        <span id="pm25-live">--</span>
        <small>µg/m³</small>
      </div>

      <div class="live-card">
        <p>PM10</p>
        <span id="pm10-live">--</span>
        <small>µg/m³</small>
      </div>

      <div class="live-card">
        <p>CO₂</p>
        <span id="co2-live">--</span>
        <small>ppm</small>
      </div>

      <div class="live-card">
        <p>AQI</p>
        <span id="aqi-live">--</span>
      </div>
    </section>

    <section class="chart-container">
      <h3>Recent trend</h3>
      <p style="font-size: 0.85rem; color: #9ca3af; margin-bottom: 0.75rem;">
        This area will show a live chart of sensor values.
      </p>
      <canvas id="liveChart" height="220"></canvas>
    </section>
  </main>

  <div id="footer"></div>
  <script src="js/main.js"></script>
</body>
</html>
