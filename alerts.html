<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alerts - Barangay Ugong AQ</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header"></div>

  <main>
    <h2 class="section-title">Alerts</h2>
    <p style="font-size: 0.9rem; color: #9ca3af; margin-bottom: 1rem;">
      This page will show automatic warnings when readings exceed the safe thresholds set in Settings.
    </p>

    <section class="forecast" style="margin-top: 0;">
      <header class="forecast-header">
        <div>
          <h2 style="font-size: 1.05rem;">Active alerts</h2>
          <p class="forecast-subtitle">
            When values cross thresholds, they will appear here.
          </p>
        </div>
        <button id="clearAlerts" type="button">
          Clear all
        </button>
      </header>

      <ul id="alertsList">
        <li>
          No alerts yet. System is monitoring in the background.
        </li>
      </ul>
    </section>
  </main>

  <div id="footer"></div>
  <script src="js/main.js"></script>
</body>
</html>
